<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scheda Guerriero</title>
<meta name="description" content="Scheda di allenamento: serie, pesi, recuperi, progressi.">
<meta name="theme-color" content="#101316">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Guerriero">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@700;800&display=swap">
<style>
/* Layout: one-handed phone column; a sticky barbell that gains one plate per finished exercise; rest timer docked at the thumb. */
:root{
  --bg:#e8eaed;--surface:#f7f8f9;--fg:#14181d;--muted:#56606b;--line:#cbd0d6;--field:#ffffff;
  --red:#c8281f;--blue:#1b62c4;--yellow:#e3ad0c;--green:#1d8a4e;--white:#fdfdfd;--steel:#8d96a0;
  --on-accent:#ffffff;--accent:var(--red);--anat-base:#dadee2;--anat-m:#b3bac2;--anat-s:#e8a29c;--heat1:#f0c2bd;--heat2:#e27a70;--scrim:rgba(20,24,29,.5);
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Atkinson Hyperlegible",-apple-system,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101316;--surface:#1b1f24;--fg:#eff1f3;--muted:#9aa4af;--line:#30363e;--field:#0c0f12;
  --red:#d9382e;--blue:#2a72d6;--yellow:#e8b520;--green:#2b9c5e;--white:#e9ebee;--steel:#68727d;
  --scrim:rgba(0,0,0,.65);--anat-base:#2c3238;--anat-m:#4b545e;--anat-s:#7d3a35;--heat1:#5c302d;--heat2:#9a3a32;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101316;--surface:#1b1f24;--fg:#eff1f3;--muted:#9aa4af;--line:#30363e;--field:#0c0f12;
  --red:#d9382e;--blue:#2a72d6;--yellow:#e8b520;--green:#2b9c5e;--white:#e9ebee;--steel:#68727d;
  --scrim:rgba(0,0,0,.65);--anat-base:#2c3238;--anat-m:#4b545e;--anat-s:#7d3a35;--heat1:#5c302d;--heat2:#9a3a32;color-scheme:dark}
[data-day="1"]{--accent:var(--red)}
[data-day="2"]{--accent:var(--blue)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.4 var(--body);font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 110px}
.wrap.training{padding-bottom:170px;padding-top:0}
h1,h2,h3,p{margin:0}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.brand{font:800 26px/1 var(--display);letter-spacing:.02em;text-transform:uppercase}
.date{color:var(--muted);text-transform:capitalize}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;min-height:54px;width:100%;padding:10px 18px;border:0;border-radius:8px;background:var(--accent);color:var(--on-accent);font:800 22px/1 var(--display);letter-spacing:.04em;text-transform:uppercase}
.btn.ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 2px var(--line)}
.btn.danger{background:transparent;color:var(--red);box-shadow:inset 0 0 0 2px var(--red)}
.link{background:none;border:0;padding:10px 0;min-height:44px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}

/* Home */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:22px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.wd.today{color:var(--fg);font-weight:700}
.disc{width:34px;height:34px;border-radius:50%;background:transparent;box-shadow:inset 0 0 0 2px var(--line);position:relative}
.disc.d1,.disc.d2{box-shadow:none}
.disc.d1{background:var(--red)}.disc.d2{background:var(--blue)}
.disc.d1::after,.disc.d2::after{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--bg)}
.wd.today .disc:not(.d1):not(.d2){box-shadow:inset 0 0 0 2px var(--fg)}
.hero{display:flex;flex-direction:column;gap:14px;margin-bottom:22px}
.hero h2{font:800 76px/.86 var(--display);text-transform:uppercase;color:var(--accent)}
.focus{font-size:18px;font-weight:700}
.muted{color:var(--muted)}
.plan{list-style:none;margin:0;padding:0}
.plan li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.plan li span:last-child{white-space:nowrap;font-weight:700}
.plan .gl{padding:12px 0 4px;border:0;font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.other{border-top:2px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:12px}
.other h3{font:800 34px/1 var(--display);text-transform:uppercase}
details summary{min-height:44px;display:flex;align-items:center;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.resume{background:var(--surface);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;margin-bottom:22px}
.resume h2{font:800 40px/1 var(--display);text-transform:uppercase;color:var(--accent)}
.sync{margin-top:22px;font-size:14px;color:var(--muted)}

/* Barbell */
.bar{position:relative;display:flex;justify-content:center;align-items:center;height:50px;gap:0}
.bar::before{content:"";position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:var(--steel)}
.side{position:relative;display:flex;align-items:center;gap:2px;width:50%}
.side.l{flex-direction:row-reverse;padding-right:16px}
.side.r{padding-left:16px}
.collar{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:3px;background:var(--steel)}
.plate{display:block;width:10px;border-radius:2px;flex:none;animation:load .22s ease-out}
.p0{height:48px;background:var(--red)}.p1{height:44px;background:var(--blue)}.p2{height:40px;background:var(--yellow)}.p3{height:36px;background:var(--green)}
.p4{height:30px;background:var(--white);box-shadow:inset 0 0 0 1px var(--steel)}.p5{height:24px;background:var(--red)}.p6{height:20px;background:var(--blue)}.p7{height:16px;background:var(--yellow)}
@keyframes load{from{transform:scaleY(.2);opacity:.2}to{transform:none;opacity:1}}

/* Workout */
.wh{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.wh-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wh-title{font:800 26px/1 var(--display);text-transform:uppercase;color:var(--accent);text-align:center}
.wh-meta{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted)}
.mini{min-height:44px;min-width:44px;padding:0 10px;border:0;border-radius:8px;background:transparent;font-weight:700}
.mini.end{color:var(--accent)}
.group{margin:20px 0 4px}
.ex{border-top:1px solid var(--line);scroll-margin-top:136px}
.ex-h{display:grid;grid-template-columns:18px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;min-height:60px;padding:10px 0;background:none;border:0;text-align:left}
.ex-n{font-size:17px;font-weight:700}
.ex-s{font:800 20px/1 var(--display);white-space:nowrap}
.dot{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line)}
.ex.done .dot{background:var(--accent);box-shadow:none}
.ex.done .ex-n,.ex.skip .ex-n{color:var(--muted)}
.ex.skip .ex-n{text-decoration:line-through}
.ex.skip .dot{box-shadow:inset 0 0 0 2px var(--line);background:linear-gradient(135deg,transparent 45%,var(--line) 45% 55%,transparent 55%)}
.ex.open .dot{box-shadow:inset 0 0 0 2px var(--accent)}
.ex.open.done .dot{background:var(--accent)}
.ex-b{display:flex;flex-direction:column;gap:12px;padding-bottom:18px}
.note{font-style:italic;color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{min-height:44px;padding:0 16px;border:0;border-radius:22px;box-shadow:inset 0 0 0 2px var(--line);background:transparent;font-weight:700}
.pill[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);box-shadow:none}
.last{font-size:15px}
.last b{font-weight:700}
.hint{min-height:44px;padding:8px 14px;border:0;border-radius:8px;background:var(--surface);box-shadow:inset 0 0 0 2px var(--green);font-weight:700;text-align:left}
.sets{display:flex;flex-direction:column;gap:8px}
.sr{display:grid;grid-template-columns:18px minmax(0,1.3fr) minmax(0,1fr) 52px;align-items:center;gap:6px}
.sr.head{font-size:13px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:center}
.sr .n{font-weight:700;color:var(--muted);text-align:center}
.stp{display:grid;grid-template-columns:32px minmax(0,1fr) 32px;height:52px;border-radius:8px;background:var(--field);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.stp button{border:0;background:transparent;font-size:22px;font-weight:700;color:var(--muted);padding:0}
.stp input{width:100%;min-width:0;border:0;background:transparent;padding:0;text-align:center;font-size:21px;font-weight:700;outline-offset:-3px;border-radius:0}
.stp input::placeholder{color:var(--muted);font-weight:400}
.tick{height:52px;border:0;border-radius:8px;box-shadow:inset 0 0 0 2px var(--line);background:transparent;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.sr.ok .tick{background:var(--accent);color:var(--on-accent);box-shadow:none}
.sr.ok .stp{opacity:.62}
.setx{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:2px}
.ex-f{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:15px;color:var(--muted)}
.alldone{margin-top:24px;display:flex;flex-direction:column;gap:12px}

/* Rest timer */
#rest{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:max(10px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#rest.over{background:var(--green);color:#fff;border-color:var(--green)}
.rp{height:5px;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 8px;background:var(--line)}
.rp i{display:block;height:100%;background:var(--accent);transform-origin:left}
#rest.over .rp{background:transparent}
.rr{display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:528px;margin:0 auto}
.rt{min-width:0}
.rd{font:800 46px/1 var(--display)}
.rl{font-size:13px;line-height:1.2}
.ra{display:flex;gap:6px;flex:none}
.ra button{min-width:46px;height:46px;padding:0 6px;border:0;border-radius:8px;box-shadow:inset 0 0 0 2px var(--line);background:transparent;font-weight:700;display:flex;align-items:center;justify-content:center}
#rest.over .ra button{box-shadow:inset 0 0 0 2px #fff}

/* Bottom nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:15;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#nav button{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px;padding:8px 0 6px;border:0;background:none;font-size:13px;color:var(--muted)}
#nav button[aria-current="page"]{color:var(--fg);font-weight:700}
#nav svg{width:24px;height:24px}

/* Sheet */
#sheet{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sh{width:100%;max-width:560px;background:var(--surface);border-radius:14px 14px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) max(18px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.sh h2{font:800 32px/1 var(--display);text-transform:uppercase}
.sh p{margin-bottom:6px}
.sh{max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.how{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:0;border-radius:8px;box-shadow:inset 0 0 0 2px var(--accent);background:transparent;color:var(--fg);font-weight:700;align-self:flex-start}
.how svg{width:18px;height:18px;color:var(--accent)}
.plan .q{min-width:44px;min-height:32px;margin:-6px 0;border:0;background:none;color:var(--accent);font-weight:700}
.anat{display:block;flex:none;width:min(100%,300px);height:auto;aspect-ratio:200/216;margin:4px auto 0}
.anat .bb{fill:var(--anat-base)}
.anat path.m0,.anat path.mP,.anat path.mS{stroke:var(--surface);stroke-width:.8;fill:var(--anat-m)}
.anat path.mP{fill:var(--red)}.anat path.mS{fill:var(--anat-s)}
.anat-k{display:flex;justify-content:center;gap:16px;font-size:13px;color:var(--muted)}
.anat-k span{display:flex;align-items:center;gap:6px}
.anat-k i{width:12px;height:12px;border-radius:3px;background:var(--red)}.anat-k i.s{background:var(--anat-s)}
.anat-v{display:grid;grid-template-columns:1fr 1fr;max-width:300px;margin:0 auto;width:100%;text-align:center;font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.vsel{display:flex;flex-direction:column;gap:8px}
.vbtn{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;min-height:52px;padding:6px 14px;border:0;border-radius:8px;background:var(--field);box-shadow:inset 0 0 0 1px var(--line);text-align:left}
.vbtn .eyebrow{font-size:12px}
.vbtn b{font-size:16px;overflow-wrap:anywhere}
.vbtn .chev{font-size:18px;color:var(--muted);transition:transform .15s}
.vbtn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.vsel.locked .vbtn{background:transparent;color:var(--fg)}
.vsel.locked svg{color:var(--muted)}
.vnote{font-size:14px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;margin:-6px 0 16px;border:0;border-radius:22px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-weight:700}
.chip svg{color:var(--muted)}.chip .chev{color:var(--muted)}
.vol{display:flex;flex-direction:column;gap:12px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.seg{display:grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:10px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.seg button{min-height:42px;border:0;border-radius:8px;background:transparent;font-weight:700;color:var(--muted)}
.seg button[aria-checked="true"]{background:var(--fg);color:var(--bg)}
.anat path.h1{fill:var(--heat1)}.anat path.h2{fill:var(--heat2)}.anat path.h3{fill:var(--red)}
.anat path.h1,.anat path.h2,.anat path.h3{stroke:var(--bg);stroke-width:.8}
.vol .anat path{stroke:var(--bg)}
.anat-k i.h1{background:var(--heat1)}.anat-k i.h2{background:var(--heat2)}.anat-k i.h3{background:var(--red)}
.vl{list-style:none;margin:0;padding:0}
.vl li{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr) 2.6em;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.vbar{position:relative;height:10px;border-radius:5px;background:var(--anat-base);overflow:hidden}
.vbar i{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--anat-m)}
.vbar i.h1{background:var(--heat1)}.vbar i.h2{background:var(--heat2)}.vbar i.h3{background:var(--red)}
.vbar b{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--fg);opacity:.5}
.vn{text-align:right;font-weight:700}
.exp{display:flex;flex-direction:column;gap:2px;margin-top:6px;font-size:14px}
.login{display:flex;flex-direction:column;gap:14px;padding-top:24px}
.login .brand{font-size:44px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.tin{min-height:50px;padding:0 12px;border:0;border-radius:8px;background:var(--field);box-shadow:inset 0 0 0 1px var(--line);font-size:17px;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2 .btn{font-size:19px}
.fp{display:flex;flex-direction:column;gap:24px}
.fp section{display:flex;flex-direction:column;gap:10px}
.acc{padding:16px;border-radius:8px;background:var(--surface)}
.fl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.frow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}
.vb{display:flex;flex-direction:column;gap:8px;margin:-6px 0 18px;padding:12px 14px;border-radius:8px;background:var(--surface);box-shadow:inset 0 0 0 2px var(--blue)}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{min-height:52px;padding:8px 14px;border:0;border-radius:8px;box-shadow:inset 0 0 0 2px var(--line);background:transparent;font-weight:700;text-align:left}
.opt[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);box-shadow:none}
.opt .tag{font-weight:400;opacity:.75}
.cust{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.cust input{min-height:50px;padding:0 12px;border:0;border-radius:8px;background:var(--field);box-shadow:inset 0 0 0 1px var(--line);font-size:17px;min-width:0}
.cust .mini{box-shadow:inset 0 0 0 2px var(--accent)}
.keep{display:flex;align-items:center;gap:10px;min-height:44px}
.keep input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.gd-m{font-weight:700;color:var(--accent)}
.gd ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.gd-e{padding:10px 12px;border-radius:8px;background:var(--bg);font-size:15px}
.gd-l{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gd-l a{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border-radius:8px;background:var(--accent);color:var(--on-accent);font:800 20px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;text-decoration:none}
.gd-l a.alt{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 2px var(--line)}
.gd-l svg{width:20px;height:20px}

/* History, progress, summary */
.pt{font:800 44px/1 var(--display);text-transform:uppercase;margin-bottom:16px}
.empty{padding:24px 0;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line)}
.empty b{font-size:18px}
.hi{border-top:1px solid var(--line)}
.hi-h{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;width:100%;padding:12px 0;min-height:60px;background:none;border:0;text-align:left}
.hi-d{font-weight:700;text-transform:capitalize}
.hi-t{font:800 20px/1.2 var(--display);text-transform:uppercase;color:var(--accent);text-align:right}
.hi-m{grid-column:1/-1;font-size:15px;color:var(--muted)}
.hi-b{padding-bottom:14px;display:flex;flex-direction:column;gap:10px}
.hl b{display:block}
.hl span{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0}
.st b{display:block;font:800 34px/1 var(--display)}
.st span{font-size:13px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
select{width:100%;min-height:50px;padding:0 12px;border:0;border-radius:8px;background:var(--field);box-shadow:inset 0 0 0 1px var(--line);font-size:17px}
#chart{position:relative;touch-action:pan-y;margin-bottom:6px}
#chart svg{display:block;width:100%;height:210px}
.tip{position:absolute;top:0;padding:6px 10px;border-radius:6px;background:var(--fg);color:var(--bg);font-size:14px;line-height:1.25;pointer-events:none;white-space:nowrap}
.sum{display:flex;flex-direction:column;gap:18px;padding-top:12px}
.sum h1{font:800 64px/.9 var(--display);text-transform:uppercase;color:var(--accent)}
.pr{list-style:none;margin:0;padding:0}
.pr li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.pr li span:last-child{font-weight:700;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.plate{animation:none}}

 'row-macc':{p:['lats','rhomb','traps'],x:['deltR','biceps'],m:"Dorsali, parte alta della schiena",q:"seated row machine chest supported",s:["Petto appoggiato al cuscinetto, braccia tese.","Tira le maniglie verso di te stringendo le scapole.","Gomiti vicini al corpo.","Torna avanti lento."],e:"Staccare il petto dal cuscinetto."},

 'affondi':{p:['quads','glutes'],x:['hams'],m:"Quadricipiti, glutei",q:"dumbbell lunges",s:["In piedi, manubri lungo i fianchi.","Fai un passo lungo in avanti.","Scendi finché il ginocchio dietro sfiora il pavimento.","Spingi col piede davanti per tornare. Le ripetizioni si contano per gamba."],e:"Passo troppo corto: il ginocchio davanti va molto oltre la punta."},

 'hyper':{p:['lowback','glutes'],x:['hams'],m:"Lombari, glutei, femorali",q:"45 degree hyperextension",s:["Cuscinetto appena sotto le anche, talloni bloccati.","Braccia incrociate sul petto, o un disco per aggiungere peso.","Scendi col busto tenendo la schiena dritta.","Risali fino al busto in linea con le gambe, non oltre."],e:"Inarcare la schiena in cima."},
 'panca-incl':{p:['pec'],x:['deltA', 'triceps'],m:'Petto alto, spalle anteriori, tricipiti',q:'incline dumbbell press',s:['Panca a 30-45°, schiena e glutei appoggiati, piedi a terra.','Manubri all\'altezza del petto, gomiti a circa 45° dal busto.','Spingi in alto e leggermente verso l\'interno, senza sbattere i manubri.','Scendi lento (2-3 s) fino a sentire l\'allungamento del petto.'],e:'Gomiti troppo aperti a 90°: stressano le spalle.'},

 'alzate':{p:['deltL'],x:['traps', 'deltA'],m:'Deltoide laterale',q:'dumbbell lateral raise',s:['In piedi, busto leggermente in avanti, gomiti appena piegati.','Alza i manubri di lato fino all\'altezza delle spalle, non oltre.','Guida con i gomiti, mignolo all\'altezza del pollice o poco sopra.','Scendi lento, senza far cadere le braccia.'],e:'Slanciare col corpo: meglio meno peso e movimento pulito.'},
 'curl-bil':{p:['biceps'],x:['forearm'],m:'Bicipiti',q:'barbell curl',s:['In piedi, presa alla larghezza delle spalle, palmi in avanti.','Gomiti fermi attaccati ai fianchi.','Porta il bilanciere verso le spalle contraendo i bicipiti.','Scendi fino a braccia quasi tese, lento.'],e:'Dondolare con la schiena per tirare su il peso.'},

 'lat':{p:['lats'],x:['biceps', 'rhomb', 'deltR'],m:'Dorsali, bicipiti',q:'lat pulldown',s:['Presa prona un po\' più larga delle spalle, cosce bloccate sotto i rulli.','Petto in fuori, busto appena inclinato indietro.','Tira la barra verso la parte alta del petto portando i gomiti giù e indietro.','Risali lento fino a braccia tese.'],e:'Tirare dietro la nuca o oscillare col busto.'},
 'rematore':{p:['lats', 'rhomb', 'traps'],x:['deltR', 'biceps'],m:'Dorsali, romboidi, trapezio medio',q:'seated cable row',s:['Seduto, piedi sulla pedana, ginocchia leggermente piegate.','Schiena dritta, petto in fuori.','Tira la maniglia verso l\'ombelico stringendo le scapole.','Torna avanti lento, allungando le braccia senza curvare la schiena.'],e:'Andare avanti e indietro col busto per muovere il peso.'},
 'pullover':{p:['lats'],x:['pec', 'triceps'],m:'Dorsali, petto',q:'cable rope pullover',s:['Al cavo alto con la corda, fai un passo indietro e inclina il busto in avanti.','Braccia quasi tese sopra la testa.','Porta la corda verso le cosce con un arco, braccia rigide.','Risali lento fino a sentire i dorsali allungati.'],e:'Piegare i gomiti: diventa un pushdown.'},

function bodySvg(main,sec){
  const lvl={};(sec||[]).forEach(k=>lvl[k]=1);main.forEach(k=>lvl[k]=2);
  return bodyFig(k=>lvl[k]===2?'mP':lvl[k]===1?'mS':'m0');
}
function bodyFig(cls){
  const fig=(map,base,side)=>{const h=bodyHalf(map,side,cls);return `<g class="bb">${base}</g><g class="bb">${h}</g><g class="bb" transform="translate(100 0) scale(-1 1)">${h}</g>`};
  return `<svg class="anat" width="300" height="324" viewBox="0 0 200 216" role="img" aria-hidden="true"><g>${fig(BODY_F,BASE_F,BASE_SIDE_F)}</g><g transform="translate(100 0)">${fig(BODY_B,BASE_B,BASE_SIDE_B)}</g></svg>`;
}

let lastSnap=null;
function onDocs(snap){
  lastSnap=snap;
  const all=snap.docs.map(d=>({id:d.id,data:d.data()}));
  const pf=all.find(d=>d.id==='profiles');
  if(pf&&pf.data&&(pf.data.updatedAt||0)>(profiles.updatedAt||0)){profiles=clone(pf.data);ls.set('sg.profiles',profiles)}
  else if(!snap.metadata.fromCache&&profiles.updatedAt&&(!pf||(pf.data.updatedAt||0)<profiles.updatedAt))col.doc('profiles').set(clone(profiles)).catch(()=>{});
  const docs=all.map(d=>({id:rawId(d.id),data:d.data})).filter(d=>d.id&&d.id!=='profiles');
  const remote=docs.filter(d=>d.id.startsWith('s-')&&!tombstones.includes(d.id)).map(d=>clone(d.data));
  const ids=new Set(remote.map(s=>s.id));
  const fromServer=!snap.metadata.fromCache;
  const keep=sessions.filter(s=>!ids.has(s.id)&&(s._pending||!fromServer));
  sessions=remote.concat(keep);saveSessions();
  if(fromServer&&!confirmed){
    confirmed=true;setSync('ok');
    sessions.filter(s=>s._pending).forEach(pushSession);
    tombstones.slice().forEach(removeRemote);
  }
  const pr=docs.find(d=>d.id==='prefs');
  if(pr&&pr.data&&(pr.data.updatedAt||0)>(prefs.updatedAt||0)){prefs=Object.assign({subs:{},custom:{}},clone(pr.data));ls.set(K('prefs'),prefs)}
  else if(fromServer&&prefs.updatedAt&&(!pr||(pr.data.updatedAt||0)<prefs.updatedAt))col.doc(D('prefs')).set(clone(prefs)).catch(()=>{});
  const a=docs.find(d=>d.id==='active');
  if(a&&a.data&&a.data.id){
    if(sessions.some(s=>s.id===a.data.id)){if(!active||active.id!==a.data.id)col.doc(D('active')).delete().catch(()=>{})}
    else if(!ended.has(a.data.id)&&(!active||a.data.updatedAt>active.updatedAt)){
      active=clone(a.data);fitActive();ls.set(K('active'),active);
      if(view==='workout'){render();return}
    }
  }
  if(view==='home'||view==='hist'||view==='prog')render();
}

}

    const prev=ls.get('sg.uid',null);

function strayProfiles(){
  const out={};
  const add=(pid,s)=>{if(!s||!s.id||sessions.some(x=>x.id===s.id))return;(out[pid]=out[pid]||new Map()).set(s.id,s)};
  if(lastSnap)for(const d of lastSnap.docs){const i=d.id.indexOf('~');if(i<0)continue;const pid=d.id.slice(0,i),r=d.id.slice(i+1);if(r.startsWith('s-'))add(pid,d.data())}
  try{for(const k of Object.keys(localStorage)){const m=k.match(/^sg\.(p[a-z0-9]+)\.sessions$/);if(m)for(const s of ls.get(k,[]))add(m[1],s)}}catch(e){}
  return Object.entries(out).map(([pid,map])=>({pid,name:profName(pid),list:[...map.values()]})).filter(x=>x.list.length);
}

function pickFriendProfile(pid){
  const v=viewing;if(!v)return;v.pid=pid;v.loading=false;

/* Importa un backup (anche quello esportato dall'app su Claude) nell'account con cui sei entrato.
   Se il backup ha più profili, chiedo quale: gli altri li importa ognuno nel proprio account. */
async function importBackup(file){
  const say=t=>{const m=document.getElementById('exp-msg');if(m)m.textContent=t};
  let data;try{data=JSON.parse(await file.text())}catch(e){say('Il file non è un backup valido.');return}
  if(!data||data.app!=='scheda-guerriero'||!Array.isArray(data.profiles)){say('Il file non è un backup di Scheda Guerriero.');return}
  const withData=data.profiles.filter(p=>p&&Array.isArray(p.sessions)&&p.sessions.length);
  if(!withData.length){say('Il backup non contiene allenamenti.');return}
  if(withData.length===1){doImport(withData[0]);return}
  sheet={imp:withData};renderSheet();
}

function doImport(bp){
  const have=new Set(sessions.map(s=>s.id));let n=0;
  for(const s of bp.sessions){if(!s||!s.id||have.has(s.id)||!Array.isArray(s.exercises))continue;
    const c=clone(s);c._pending=true;sessions.push(c);have.add(c.id);n++;pushSession(c)}
  saveSessions();
  const bpr=bp.prefs||{};
  if(bpr.subs||bpr.custom){prefs=Object.assign({subs:{},custom:{}},prefs);prefs.subs=Object.assign({},bpr.subs||{},prefs.subs);prefs.custom=Object.assign({},bpr.custom||{},prefs.custom);savePrefs()}
  sheet=null;render();
  const m=document.getElementById('exp-msg');if(m)m.textContent=n?`Importati ${n} allenamenti di ${bp.name||'questo profilo'}.`:'Niente di nuovo da importare: questi allenamenti c\'erano già.';
}

function relDays(t){const a=new Date();a.setHours(0,0,0,0);const b=new Date(t);b.setHours(0,0,0,0);const n=Math.round((a-b)/864e5);return n===0?'oggi':n===1?'ieri':n+' giorni fa'}

/* Rest timer */
let audio=null;
function unlockAudio(){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch(e){}}
function beep(){
  if(navigator.vibrate)try{navigator.vibrate([200,100,200])}catch(e){}
  if(!sound||!audio)return;
  try{[0,.28,.56].forEach(t=>{const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=880;g.gain.setValueAtTime(.0001,audio.currentTime+t);g.gain.exponentialRampToValueAtTime(.5,audio.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+t+.22);o.connect(g).connect(audio.destination);o.start(audio.currentTime+t);o.stop(audio.currentTime+t+.24)})}catch(e){}
}
function renderRest(){
  const r=active&&active.rest;
  if(!r||view!=='workout'){restEl.hidden=true;restEl.innerHTML='';restEl.className='';return}
  restEl.hidden=false;restEl.dataset.day=active.day;
  restEl.innerHTML=`<div class="rp"><i id="rb"></i></div><div class="rr"><div class="rt"><div class="rd" id="rd" role="timer">0:00</div><div class="rl" id="rl">Recupero</div></div><div class="ra"><button data-act="sound" aria-label="${sound?'Disattiva':'Attiva'} il suono">${sound?ICON.on:ICON.off}</button><button data-act="rest-adj" data-d="-15" aria-label="Togli 15 secondi">−15</button><button data-act="rest-adj" data-d="15" aria-label="Aggiungi 15 secondi">+15</button><button data-act="rest-stop" aria-label="Chiudi il recupero">✕</button></div></div>`;
  tickRest();
}
function tickRest(){
  const el=document.getElementById('elapsed');if(el&&active)el.textContent=clock((Date.now()-active.startedAt)/1000);
  const r=active&&active.rest;if(!r)return;
  const left=(r.endAt-Date.now())/1000;
  if(left<=0&&!r.beeped){r.beeped=true;ls.set(K('active'),active);if(left>-5)beep()}
  if(left<-180){active.rest=null;saveActive();renderRest();return}
  if(view!=='workout')return;
  const d=document.getElementById('rd'),l=document.getElementById('rl'),b=document.getElementById('rb');if(!d)return;
  if(left>0){restEl.classList.remove('over');d.textContent=clock(Math.ceil(left));l.textContent='Recupero, non barare';b.style.transform=`scaleX(${Math.min(1,left/r.total)})`}
  else{restEl.classList.add('over');d.textContent='+'+clock(-left);l.textContent='Recuperato: prossima serie';b.style.transform='scaleX(0)'}
}

  for(const a of ALTS[slot.id]||[])o.push({id:a.id,v:null,label:a.name});
  for(const [id,c] of Object.entries(prefs.custom||{}))if(c.slot===slot.id)o.push({id,v:null,label:c.name,name:c.name});
  return o;
}

function pickOpt(id,v,name){

async function emailAuth(create){
  const e=(document.getElementById('li-email').value||'').trim(),p=document.getElementById('li-pass').value||'',m=document.getElementById('li-msg');
  if(!e||!p){m.textContent='Scrivi email e password.';return}

  try{if(create){const r=await fauth.createUserWithEmailAndPassword(e,p);try{await r.user.sendEmailVerification()}catch(_){}}else await fauth.signInWithEmailAndPassword(e,p)}
  catch(x){loginMsg=authErr(x);m.textContent=loginMsg}
}
function buildBackup(){
  const cloud=lastSnap?lastSnap.docs.map(d=>({id:d.id,data:d.data()})):[];
  const out={app:'scheda-guerriero',version:1,exportedAt:new Date().toISOString(),profiles:[]};
  for(const p of profiles.list){
    const key=n=>p.id==='main'?'sg.'+n:'sg.'+p.id+'.'+n;
    const raw=id=>{const i=id.indexOf('~');if(p.id==='main')return i<0?id:null;return id.startsWith(p.id+'~')?id.slice(p.id.length+1):null};
    const map=new Map();
    for(const x of (p.id===profile?sessions:ls.get(key('sessions'),[])))map.set(x.id,x);
    let pr=p.id===profile?prefs:ls.get(key('prefs'),{});
    for(const d of cloud){const r=raw(d.id);if(!r)continue;if(r.startsWith('s-'))map.set(r,d.data);else if(r==='prefs'&&(d.data.updatedAt||0)>(pr.updatedAt||0))pr=d.data}
    const list=[...map.values()].map(x=>{const c=clone(x);delete c._pending;return c}).sort(byDate);
    out.profiles.push({id:p.id,name:p.name,sessions:list,prefs:pr});
  }
  return out;
}

  'set-del'(){const x=curX(),l=x.sets[x.sets.length-1];if(x.sets.length>1&&l&&!l.done){x.sets.pop();saveActive();render()}},
  skip(){const x=curX();x.skipped=!x.skipped;if(x.skipped){const n=nextOpen();if(n!=null){active.open=n;scrollTo=n}}saveActive();render()},
  'rest-adj'(t){const r=active.rest;if(!r)return;const d=+t.dataset.d*1000;r.endAt=Math.max(Date.now(),r.endAt)+d;if(r.endAt<=Date.now()){active.rest=null}else{r.beeped=false;r.total=Math.max(r.total,(r.endAt-Date.now())/1000)}saveActive();renderRest()},
  'rest-stop'(){active.rest=null;saveActive();renderRest()},
  sound(){sound=!sound;ls.set('sg.sound',sound);unlockAudio();renderRest()},
  'ask-finish'(){sheet='finish';renderSheet()},
  'ask-discard'(){sheet='discard';renderSheet()},
  'sheet-close'(){sheet=null;renderSheet()},
  'sub-custom'(){const inp=document.getElementById('sub-name'),n=(inp.value||'').trim().replace(/\s+/g,' ');if(!n){inp.focus();return}
    const known=Object.values(EX).find(e=>e.name.toLowerCase()===n.toLowerCase());pickOpt(known?known.id:slug(n),null,known?known.name:n)},
  guide(t){sheet={guide:t.dataset.id,v:t.dataset.v||null,name:t.dataset.name};renderSheet();const b=sheetEl.querySelector('.sh');if(b)b.scrollTop=0},
  discard(){ended.add(active.id);active=null;sheet=null;view='home';dropLock();saveActive();render();window.scrollTo(0,0)},
  save(){
    const a=active,now=Date.now();
    const full=a.exercises.filter(exDone).length;
    const exercises=a.exercises.map(x=>({id:x.id,variant:x.variant||null,...(EX[x.id]?{}:{name:x.name||x.id}),sets:x.sets.filter(s=>s.done).map(s=>({kg:s.kg,reps:s.reps}))})).filter(x=>x.sets.length);
    if(!exercises.length){sheet='finish';renderSheet();return}
    const prs=[];for(const x of exercises){const prev=entries(x.id,x.variant);if(!prev.length)continue;const best=Math.max(...prev.map(p=>topKg(p.sets))),top=topKg(x.sets);if(top>best)prs.push({name:nameOf(x.id,x),kg:top})}
    const s={id:a.id,day:a.day,startedAt:a.startedAt,endedAt:now,exercises,_pending:true};
    sessions.push(s);saveSessions();pushSession(s);
    ended.add(a.id);active=null;sheet=null;summary={...s,prs,full};view='summary';dropLock();saveActive();render();window.scrollTo(0,0)},
  hist(t){openHist=openHist===t.dataset.id?null:t.dataset.id;delAsk=null;render()},
  del(t){delAsk=t.dataset.id;render()},
  'del-no'(){delAsk=null;render()},
  'del-yes'(t){const id=t.dataset.id;sessions=sessions.filter(s=>s.id!==id);saveSessions();tombstones.push(id);ls.set(K('deleted'),tombstones);removeRemote(id);delAsk=null;openHist=null;render()}
};
document.addEventListener('click',ev=>{if(ev.target===sheetEl&&sheet&&typeof sheet==='object'){sheet=null;renderSheet();return}const t=ev.target.closest('[data-act]');if(!t)return;const f=ACT[t.dataset.act];if(f)f(t)});
document.addEventListener('input',ev=>{const t=ev.target;if(!t.dataset||!t.dataset.f||!active)return;setVal(+t.dataset.i,t.dataset.f,parse(t.value))});
document.addEventListener('change',ev=>{if(ev.target.id==='imp'&&ev.target.files&&ev.target.files[0]){importBackup(ev.target.files[0]);ev.target.value='';return}if(ev.target.id==='prog-ex'){progKey=ev.target.value;render()}});
document.addEventListener('focusin',ev=>{if(ev.target.matches&&ev.target.matches('.stp input'))ev.target.select()});
window.addEventListener('resize',()=>{if(view==='prog')drawChart()});

try{fitActive()}catch(e){active=null}
if(!ls.get('sg.uid',null)&&!ls.get('sg.skip',false)&&window.firebase)view='login';
try{render();app.dataset.ok='1'}catch(e){showCrash(e.message+' @render');try{view='home';active=null;render();app.dataset.ok='1'}catch(_){}}
connect().catch(()=>setSync('err'));
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
